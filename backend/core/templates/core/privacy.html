<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>League App: {{ policy.title }}</title>
  <style>
    /* Values from the League App design system (design/src/ds/tokens.css, Night theme). */
    :root {
      --ground: #0c1611; --ink: #edf3ec; --ink-muted: #9fb2a5; --accent-ink: #cff25a;
      --space-2: 8px; --space-4: 16px; --space-5: 24px; --gutter: 16px;
      --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
      --font-sans: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-sans);
           font-size: 16px; line-height: 24px; }
    main { max-width: 560px; margin: 0 auto; padding: var(--space-5) var(--gutter); }
    h1 { font-family: var(--font-display); font-size: 32px; line-height: 36px; margin: 0 0 var(--space-2); }
    h2 { font-size: 18px; line-height: 24px; margin: var(--space-5) 0 var(--space-2); }
    p { margin: 0 0 var(--space-4); }
    .meta { color: var(--ink-muted); font-size: 13px; line-height: 18px; }
    a { color: var(--accent-ink); }
  </style>
</head>
<body>
  <main>
    <h1>{{ policy.title }}</h1>
    <p class="meta">League App, run by {{ policy.operator }}. Last updated {{ policy.updated_on|date:"D j M Y" }}.</p>
    {% for section in policy.sections %}
      <h2>{{ section.heading }}</h2>
      {% for paragraph in section.paragraphs %}<p>{{ paragraph|urlize }}</p>{% endfor %}
    {% endfor %}
  </main>
</body>
</html>
