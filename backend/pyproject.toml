[project]
name = "leagueapp-backend"
version = "0.1.0"
description = "League App API: Django + Django REST Framework"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "B",            # bugbear
    "UP",           # pyupgrade
    "DJ",           # Django
    "DTZ",          # naive datetimes
    "S",            # bandit security checks
    "SIM",
    "RUF",
]
ignore = [
    "RUF012",  # DRF class attributes (permission_classes etc.) are idiomatic lists
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]  # settings layer with `from .base import *`
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and test passwords

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
